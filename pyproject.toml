[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-evidence-search"
version = "1.0.0"
description = "Evidence-Ranked Enterprise Search Tool for Architecture Decisions"
authors = [{ name = "Enterprise Engineering Team", email = "architecture-team@organization.com" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = []
